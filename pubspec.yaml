name: pos_inventory_app
description: Inventory, receipts, and PDF invoicing app with an offline assistant.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage (works on iOS, Android, and Web)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # PDF generation + preview/print/share
  pdf: ^3.11.1
  printing: ^5.13.1

  # Receipt image capture + OCR (mobile only; web falls back to manual entry)
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.16.0

  # Utilities
  uuid: ^4.4.2
  intl: ^0.20.3
  share_plus: ^13.3.0
  fl_chart: ^1.2.0
  google_fonts: ^8.2.0
  file_picker: ^12.0.0-beta.7
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  # assets:
  #   - assets/logo.png
