[build]
  command   = "git clone https://github.com/flutter/flutter.git --depth 1 -b stable flutter && flutter/bin/flutter config --enable-web && flutter/bin/flutter pub get && dart run build_runner build --delete-conflicting-outputs && flutter/bin/flutter build web --release"
  publish   = "build/web"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200